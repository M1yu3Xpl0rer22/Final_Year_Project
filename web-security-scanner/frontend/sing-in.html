<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - ShieldByte</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>

<body style="display: flex; flex-direction: column; min-height: 100vh;">

  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo">
        <div class="logo-icon">⚡</div>
        ShieldByte
      </a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <button class="theme-toggle" onclick="toggleTheme()" title="Toggle Theme">🌙</button>
      </div>
    </div>
  </nav>

  <div style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem;">
    <div class="glass-panel animate-fade-in" style="width: 100%; max-width: 400px; padding: 3rem;">
      <h1 style="text-align: center; margin-bottom: 2rem; font-size: 2rem;">Sign In</h1>

      <form id="loginForm" style="display: flex; flex-direction: column; gap: 1rem;">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required
            style="width: 100%; padding: 0.8rem; border-radius: 4px; border: 1px solid var(--border); background: rgba(0,0,0,0.2); color: var(--text-main);" />
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
            <label for="password" style="margin-bottom: 0;">Password</label>
            <a href="#" style="font-size: 0.85rem; color: var(--primary);">Forgot?</a>
          </div>
          <input type="password" id="password" name="password" required
            style="width: 100%; padding: 0.8rem; border-radius: 4px; border: 1px solid var(--border); background: rgba(0,0,0,0.2); color: var(--text-main);" />
        </div>

        <div id="message"
          style="display: none; padding: 1rem; border-radius: 4px; margin-top: 1rem; font-size: 0.9rem;"></div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 1rem; margin-top: 1rem;">Sign
          In</button>
      </form>

      <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
          e.preventDefault();
          const messageDiv = document.getElementById('message');
          const submitBtn = e.target.querySelector('button');

          const formData = {
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
          };

          try {
            submitBtn.disabled = true;
            submitBtn.textContent = 'Signing In...';

            const response = await fetch('/api/auth/login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(formData)
            });

            const result = await response.json();

            if (response.ok) {
              messageDiv.style.display = 'block';
              messageDiv.style.background = 'rgba(88, 129, 87, 0.2)';
              messageDiv.style.border = '1px solid var(--primary)';
              messageDiv.style.color = 'var(--primary)';
              messageDiv.textContent = 'Login successful! Redirecting...';

              // Store user info and token
              localStorage.setItem('sb_user', JSON.stringify(result.user));
              localStorage.setItem('sb_token', result.access_token);

              setTimeout(() => window.location.href = 'index.html', 1500);
            } else {
              messageDiv.style.display = 'block';
              messageDiv.style.background = 'rgba(239, 68, 68, 0.1)';
              messageDiv.style.border = '1px solid var(--danger)';
              messageDiv.style.color = 'var(--danger)';
              messageDiv.textContent = 'Error: ' + result.error;
              submitBtn.disabled = false;
              submitBtn.textContent = 'Sign In';
            }
          } catch (error) {
            console.error('Login error:', error);
            messageDiv.style.display = 'block';
            messageDiv.style.background = 'rgba(239, 68, 68, 0.1)';
            messageDiv.style.border = '1px solid var(--danger)';
            messageDiv.style.color = 'var(--danger)';
            messageDiv.textContent = 'Communication error with server.';
            submitBtn.disabled = false;
            submitBtn.textContent = 'Sign In';
          }
        });
      </script>

      <p style="text-align: center; margin-top: 1.5rem; color: var(--text-muted); font-size: 0.9rem;">
        Don't have an account? <a href="create acc.html" style="color: var(--primary);">Sign up</a>
      </p>
    </div>
  </div>

  <script src="css/theme-toggle.js"></script>
</body>

</html>
