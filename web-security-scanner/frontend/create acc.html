<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - ShieldByte</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>

<body style="display: flex; flex-direction: column; min-height: 100vh;">

  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo">
        <div class="logo-icon">⚡</div>
        ShieldByte
      </a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <button class="theme-toggle" onclick="toggleTheme()" title="Toggle Theme">🌙</button>
      </div>
    </div>
  </nav>

  <div style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem;">
    <div class="glass-panel animate-fade-in" style="width: 100%; max-width: 450px; padding: 3rem;">
      <h1 style="text-align: center; margin-bottom: 2rem; font-size: 2rem;">Create Account</h1>

      <form action="#" method="POST">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" required />
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required />
        </div>

        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" required />
        </div>

        <div style="margin-bottom: 2rem;" class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required />
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%;">Create Account</button>
      </form>

      <p style="text-align: center; margin-top: 1.5rem; color: var(--text-muted); font-size: 0.9rem;">
        Already have an account? <a href="sing-in.html" style="color: var(--primary);">Sign in</a>
      </p>
    </div>
  </div>

  <script src="css/theme-toggle.js"></script>
</body>

</html>
