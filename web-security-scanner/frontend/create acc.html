<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - ShieldByte</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>

<body style="display: flex; flex-direction: column; min-height: 100vh;">

  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo">
        <div class="logo-icon">⚡</div>
        ShieldByte
      </a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <button class="theme-toggle" onclick="toggleTheme()" title="Toggle Theme">🌙</button>
      </div>
    </div>
  </nav>

  <div style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem;">
    <div class="glass-panel animate-fade-in" style="width: 100%; max-width: 450px; padding: 3rem;">
      <h1 style="text-align: center; margin-bottom: 2rem; font-size: 2rem;">Create Account</h1>

      <form id="signupForm" style="display: flex; flex-direction: column; gap: 1rem;">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" required minlength="2" placeholder="e.g. John Doe"
            style="width: 100%; padding: 0.8rem; border-radius: 4px; border: 1px solid var(--border); background: rgba(0,0,0,0.2); color: var(--text-main);" />
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required placeholder="name@example.com"
            style="width: 100%; padding: 0.8rem; border-radius: 4px; border: 1px solid var(--border); background: rgba(0,0,0,0.2); color: var(--text-main);" />
        </div>

        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" required pattern="^[a-zA-Z0-9_\-]+$"
            title="Letters, numbers, underscores, and hyphens only"
            style="width: 100%; padding: 0.8rem; border-radius: 4px; border: 1px solid var(--border); background: rgba(0,0,0,0.2); color: var(--text-main);" />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required minlength="6" placeholder="Min 6 characters"
            style="width: 100%; padding: 0.8rem; border-radius: 4px; border: 1px solid var(--border); background: rgba(0,0,0,0.2); color: var(--text-main);" />
        </div>

        <div id="message"
          style="display: none; padding: 1rem; border-radius: 4px; margin-top: 1rem; font-size: 0.9rem;"></div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 1rem; margin-top: 1rem;">Create
          Account</button>
      </form>

      <p style="text-align: center; margin-top: 1.5rem; color: var(--text-muted); font-size: 0.9rem;">
        Already have an account? <a href="sing-in.html" style="color: var(--primary);">Sign in</a>
      </p>

      <script>
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
          e.preventDefault();
          const messageDiv = document.getElementById('message');
          const submitBtn = e.target.querySelector('button');

          const formData = {
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            username: document.getElementById('username').value,
            password: document.getElementById('password').value
          };

          try {
            submitBtn.disabled = true;
            submitBtn.textContent = 'Creating Account...';

            const response = await fetch('/api/auth/signup', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(formData)
            });

            const result = await response.json();

            messageDiv.style.display = 'block';
            if (response.ok) {
              messageDiv.style.background = 'rgba(88, 129, 87, 0.2)';
              messageDiv.style.border = '1px solid var(--primary)';
              messageDiv.style.color = 'var(--primary)';
              messageDiv.textContent = 'Account created! Please check your email for confirmation. Redirecting to login...';
              setTimeout(() => window.location.href = 'sing-in.html', 3000);
            } else {
              messageDiv.style.background = 'rgba(239, 68, 68, 0.1)';
              messageDiv.style.border = '1px solid var(--danger)';
              messageDiv.style.color = 'var(--danger)';
              messageDiv.textContent = 'Error: ' + result.error;
              submitBtn.disabled = false;
              submitBtn.textContent = 'Create Account';
            }
          } catch (error) {
            console.error('Signup error:', error);
            messageDiv.style.display = 'block';
            messageDiv.style.background = 'rgba(239, 68, 68, 0.1)';
            messageDiv.style.border = '1px solid var(--danger)';
            messageDiv.style.color = 'var(--danger)';
            messageDiv.textContent = 'Communication error with server.';
            submitBtn.disabled = false;
            submitBtn.textContent = 'Create Account';
          }
        });
      </script>
    </div>
  </div>

  <script src="css/theme-toggle.js"></script>
</body>

</html>
